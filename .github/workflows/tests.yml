name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    name: lint, types, tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      # Actions are pinned by commit; the tag is in the comment. Bump both together.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m mypy
      # pytest includes tests/test_pins.py: the installed CNS must be the commit pyproject pins.
      - run: pytest -q
      # The template account on a real record, without a model and without credentials: the Watcher
      # must work where no key exists, and must refuse to write into any folder the record names.
      - run: python -m watcher.cli narrate tests/fixtures/swizzle_joined_run.json --no-model --out "$RUNNER_TEMP/account.md"
      - run: python -m watcher.cli narrate tests/fixtures/warden_tagteam_seats_run.json --no-model --out "$RUNNER_TEMP/account2.md"

  warden-e2e:
    name: the real Warden writes, the Watcher reads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      # WARDEN is public. This is the tested set: the commit below is WARDEN 0.13.4 and may be one or more
      # commits behind WARDEN's branch head. To bump it, change `ref` to the new full commit SHA here, in
      # `coinstall-warden` and in README.md (tests/test_pins.py fails if they disagree), then re-run.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: wking53214/WARDEN
          ref: 36e98433f4928b7d12905f02b56e55ee1943b56e
          path: _warden
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      # The Watcher pins CNS v1.9.0 (da18e411743d4e3b0e783105394d845fb1c16746). The Warden commit above still requires
      # CNS v1.8.0 (5252ceebe98185f7be81212d988055ccf9884568), which pip cannot resolve together with it. So Warden is
      # installed with --no-deps until Warden's own commit pins CNS da18e411743d4e3b0e783105394d845fb1c16746. When the
      # owner session gives the new Warden commit SHA, change `ref` here and in `coinstall-warden` to it (full SHA, not
      # invented) and drop --no-deps. The Watcher reads only cns.run, which is identical in v1.8.0 and v1.9.0.
      - run: pip install -e ".[dev]"
      - run: pip install --no-deps ./_warden
      - run: pip check
      - run: python -m pytest -q tests/test_pins.py
      - run: warden --help > /dev/null
      - run: python -m pytest -q -m e2e tests/test_warden_e2e.py
      # By hand, the same thing end to end: a record from Warden, then the account, exit 0.
      - run: |
          warden tagteam "$RUNNER_TEMP/no-such-folder" > "$RUNNER_TEMP/run.json" || test $? -eq 2
          watcher narrate "$RUNNER_TEMP/run.json" --no-model --out "$RUNNER_TEMP/account.md"
          grep -q 'USAGE_ERROR' "$RUNNER_TEMP/account.md"

  coinstall-warden:
    name: pip resolves the Watcher and Warden together, and pip check is clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      # The same WARDEN commit as `warden-e2e` (WARDEN 0.13.4, the tested set).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: wking53214/WARDEN
          ref: 36e98433f4928b7d12905f02b56e55ee1943b56e
          path: _warden
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      # Warden is installed with --no-deps until Warden's own commit pins CNS da18e411743d4e3b0e783105394d845fb1c16746
      # (the same reason and the same fix as in `warden-e2e`: its current commit requires CNS v1.8.0, which conflicts
      # with the Watcher's v1.9.0 in pip). Once the owner session gives the new Warden SHA, set `ref` above to it and
      # install both with full dependency resolution: `pip install . ./_warden`.
      - run: pip install .
      - run: pip install --no-deps ./_warden
      - run: pip check
