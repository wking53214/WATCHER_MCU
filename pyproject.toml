[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "watcher-mcu"
dynamic = ["version"]  # one source of truth: watcher.__version__
description = "The Watcher: an AI entity that sees every run of the circuit and is sworn not to interfere. It narrates Warden's run record for a person; every sentence cites a measurement or is dropped."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "William N. King" }]
keywords = ["code-quality", "change-control", "narration", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
# The official SDK only. The Watcher imports nothing of the circuit (tests/test_charter.py reads the source).
# The run record contract (cns.run/1) comes from the CNS repository. Pinned to the full commit of release v1.9.0.
dependencies = ["anthropic>=1.14,<2", "cns @ git+https://github.com/wking53214/CNS.git@da18e411743d4e3b0e783105394d845fb1c16746"]  # v1.9.0

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.15.22", "mypy==1.20.2"]

[project.scripts]
watcher = "watcher.cli:main"

[project.urls]
Homepage = "https://github.com/wking53214/WATCHER_MCU"

[tool.setuptools.dynamic]
version = { attr = "watcher.__version__" }

[tool.setuptools.packages.find]
include = ["watcher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The end-to-end test needs the real Warden installed; the `warden-e2e` CI job selects it with `-m e2e`.
addopts = "-m 'not e2e'"
markers = ["e2e: runs the real Warden writer and reads its record (needs Warden installed)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "C4", "SIM", "PT", "RUF", "S", "N", "PIE", "RET", "TID"]
# UnreadableRecord and Refused are public names that read as sentences ("the record is unreadable"); renaming them
# to *Error would break importers for no gain.
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
# The lookalike table exists to hold ambiguous characters.
"watcher/_homoglyphs.py" = ["RUF001"]
"tests/test_oath.py" = ["RUF001"]
# Tests assert, and the end-to-end test runs the Warden command line on purpose.
"tests/**" = ["S101", "S603", "S607", "PT018"]
# PT018 is off for tests: the suite asserts a few related facts on one line and the message is the line itself.

[tool.mypy]
python_version = "3.11"
files = ["watcher", "tests"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# Test bodies are not annotated; they are still checked (check_untyped_defs), and every function in watcher/ is typed.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
check_untyped_defs = true
